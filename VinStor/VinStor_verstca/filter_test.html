<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .wheel {
      width: 220px;
      height: 210px;
      margin: 50px auto;
      overflow: hidden;
      position: relative;
      border: 1px solid #ddd;
      background: #fff;

      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .wheel:active {
      cursor: grabbing;
    }
    .wheel-list {
      width: 100%;
      transition: all .3s ease-in-out;

      will-change: transform;
    }
    .wheel-item {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #999;
    }
    .year-highlight {
      position: absolute;
      top: 84px;
      left: 0;
      right: 0;
      height: 42px;
      border-top: 1px solid #2878df;
      border-bottom: 1px solid #2878df;
      background: rgba(40,120,223,.07);
      pointer-events: none;
    }
  </style>
</head>
<body>
  
  <div id="wheel" class="wheel">

      <div id="wheelList" class="wheel-list">

          <div class="wheel-item">2026</div>
          <div class="wheel-item">2025</div>
          <div class="wheel-item">2024</div>
          <div class="wheel-item">2023</div>
          <div class="wheel-item">2022</div>
          <div class="wheel-item">2021</div>
          <div class="wheel-item">2020</div>
          <div class="wheel-item">2019</div>
          <div class="wheel-item">2018</div>
          <div class="wheel-item">2017</div>
          <div class="wheel-item">2016</div>
          <div class="wheel-item">2015</div>
          <div class="wheel-item">2014</div>
          <div class="wheel-item">2013</div>

      </div>
      <div class="year-highlight"></div>
  </div>

  <script>
    
    const wheel = document.querySelector('.wheel');
    const wheelList = document.querySelector('.wheel-list');
    const wheelItem = document.querySelector('.wheel-item');
    
    let heightItem = wheelItem.scrollHeight;
    let height = wheelList.scrollHeight;
    
    let position = heightItem * 2;
    let isDragging = false;
    let startY = 0;
    let startPosition = 0;

    // ====================================
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;
    // ====================================

    let selectedIndex = 0;

    function render() {
      if ((heightItem * 2) <= position) position = heightItem * 2;
      else if ((height - heightItem * 3) * -1 >= position) position = (height - heightItem * 3) * -1;
      // selectedIndex = Math.round((heightItem * 2 - position) / heightItem);
      wheelList.style.transform = `translateY(${position}px)`;
    }

    wheel.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startY = e.clientY;
      startPosition = position;

      // ====================================
      lastY = e.clientY;
      lastTime = performance.now();
      velocity = 0;
      // ====================================

      wheelList.style.transition = 'unset';
      // Закрепляем указатель за колесом
      wheel.setPointerCapture(e.pointerId);
    });

    wheel.addEventListener('pointermove', (e) => {
      if(!isDragging) return;
      const distance = e.clientY - startY;
      position = startPosition + distance;

      // ====================================
      const now = performance.now();

      const deltaY = e.clientY - lastY;
      const deltaTime = now - lastTime;

      if (deltaTime > 0) velocity = deltaY / deltaTime;

      lastY = e.clientY;
      lastTime = now;
      // ====================================

      render();
    });

    function inertia() {
      position += velocity * 16;
      velocity *= 0.95;
      render();
      if (Math.abs(velocity) > 0.02) requestAnimationFrame(inertia);
      else stopAtNearest();
    }

    function stopAtNearest() {
      // 1. Вычисляем ближайший индекс
      selectedIndex = Math.round((heightItem * 2 - position) / heightItem);
      // 2. Вычисляем точную позицию элемента
      position = heightItem * 2 - selectedIndex * heightItem;
      // 3. Включаем плавную анимацию
      wheelList.style.transition = 'transform .3s ease-out';
      // 4. Обновляем положение колеса
      render();
    }

    // Завершение перетаскивания
    function stopDragging() {
      isDragging = false;
      inertia();
    }
    wheel.addEventListener('pointerup', stopDragging);
    wheel.addEventListener('pointercancel', stopDragging);

    render();
  </script>
</body>
</html>
