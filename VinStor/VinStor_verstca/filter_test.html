<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .wheel {
      width: 220px;
      height: 210px;
      margin: 50px auto;
      overflow: hidden;
      position: relative;
      border: 1px solid #ddd;
      background: #fff;

      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .wheel:active {
      cursor: grabbing;
    }
    .wheel-list {
      width: 100%;
      transition: all .3s ease-in-out;

      will-change: transform;
    }
    .wheel-item {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #999;
    }
  </style>
</head>
<body>
  
  <div id="wheel" class="wheel">

      <div id="wheelList" class="wheel-list">

          <div class="wheel-item">2026</div>
          <div class="wheel-item">2025</div>
          <div class="wheel-item">2024</div>
          <div class="wheel-item">2023</div>
          <div class="wheel-item">2022</div>
          <div class="wheel-item">2021</div>
          <div class="wheel-item">2020</div>

      </div>

  </div>
  
  <!-- <button id="up">Вверх</button>
  <button id="down">Вниз</button> -->

  <script>
    
    const wheel = document.querySelector('.wheel');
    const wheelList = document.querySelector('.wheel-list');
    const wheelItem = document.querySelector('.wheel-item');
    
    let heightItem = wheelItem.scrollHeight;
    let height = wheelList.scrollHeight;
    
    let position = heightItem * 2;
    // let position = 0;
    let isDragging = false;
    let startY = 0;
    let startPosition = 0;

    let selectedIndex = 0;
    // const year = years[selectedIndex];

    function render() {
      if ((heightItem * 2) <= position) position = heightItem * 2;
      else if ((height - heightItem * 3) * -1 >= position) position = (height - heightItem * 3) * -1;
      
      // selectedIndex = Math.round(Math.abs(position) / heightItem);
      // console.log(selectedIndex);

      selectedIndex = Math.round(
        (heightItem * 2 - position) / heightItem
      );
      // console.log(position);
      // console.log(heightItem * 2 - position);
      console.log(selectedIndex);

      wheelList.style.transform = `translateY(${position}px)`;
    }
    
    // document.getElementById('up').addEventListener('click', () => {
    //   position -= 42;
    //   render();
    // });

    // document.getElementById('down').addEventListener('click', () => {
    //   position += 42;
    //   render();
    // });

    wheel.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startY = e.clientY;
      startPosition = position;

      wheelList.style.transition = 'unset';
      
      // Закрепляем указатель за колесом
      wheel.setPointerCapture(e.pointerId);
    });

    wheel.addEventListener('pointermove', (e) => {
      if(!isDragging) return;
      const distance = e.clientY - startY;
      position = startPosition + distance;
      render();
    });

    // Завершение перетаскивания
    function stopDragging() {
      isDragging = false;
      position = heightItem * 2 - selectedIndex * heightItem;
      render();

      wheelList.style.transition = 'all .3s ease-in-out';
    }
    wheel.addEventListener('pointerup', stopDragging);
    wheel.addEventListener('pointercancel', stopDragging);
    
    // wheel.addEventListener('pointerup', function() {
    //   isDragging = false;
    //   wheelList.style.transition = 'all .3s ease-in-out';
    //   // wheel.releasePointerCapture(event.pointerId);
    // });
    render();
  </script>
